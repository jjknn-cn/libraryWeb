<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 · 图书馆管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" v-cloak class="auth-page">
    <div class="auth-card wide">
        <div class="auth-brand">
            <div class="logo">📝</div>
            <h1>用户注册</h1>
            <p>姓名不可重复 · 手机号不可重复</p>
        </div>

        <div v-if="error" class="alert alert-error">{{ error }}</div>
        <div v-if="success" class="alert alert-success">{{ success }}</div>

        <form @submit.prevent="submit">
            <div class="form-grid">
                <div class="field">
                    <label>姓名（用户名）<span class="req">*</span></label>
                    <input class="input" v-model.trim="form.name" maxlength="20" placeholder="2-20 个字符">
                </div>
                <div class="field">
                    <label>手机号<span class="req">*</span></label>
                    <input class="input" v-model.trim="form.phone" maxlength="11" placeholder="11 位手机号">
                </div>
                <div class="field">
                    <label>密码<span class="req">*</span></label>
                    <input class="input" type="password" v-model="form.password" placeholder="不少于 6 位">
                </div>
                <div class="field">
                    <label>确认密码<span class="req">*</span></label>
                    <input class="input" type="password" v-model="form.confirm" placeholder="再次输入密码">
                </div>
                <div class="field">
                    <label>专业<span class="req">*</span></label>
                    <select class="select" v-model="form.major">
                        <option value="">请选择专业</option>
                        <option v-for="m in majors" :key="m" :value="m">{{ m }}</option>
                    </select>
                </div>
                <div class="field">
                    <label>角色<span class="req">*</span></label>
                    <select class="select" v-model="form.role">
                        <option v-for="r in roles" :key="r" :value="r">{{ r }}</option>
                    </select>
                    <div class="hint">选择角色后，下方会显示该角色特有的信息</div>
                </div>

                <template v-if="form.role === '学生'">
                    <div class="field">
                        <label>年级<span class="req">*</span></label>
                        <select class="select" v-model="form.grade">
                            <option value="">请选择年级</option>
                            <option v-for="g in grades" :key="g" :value="g">{{ g }}</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>所属学院<span class="req">*</span></label>
                        <input class="input" v-model.trim="form.college" maxlength="30" placeholder="如：计算机学院">
                    </div>
                </template>

                <template v-if="form.role === '教师'">
                    <div class="field">
                        <label>所属学院<span class="req">*</span></label>
                        <input class="input" v-model.trim="form.college" maxlength="30" placeholder="如：计算机学院">
                    </div>
                    <div class="field">
                        <label>职称<span class="req">*</span></label>
                        <select class="select" v-model="form.title">
                            <option value="">请选择职称</option>
                            <option v-for="t in titles" :key="t" :value="t">{{ t }}</option>
                        </select>
                    </div>
                </template>

                <template v-if="form.role === '管理员'">
                    <div class="field">
                        <label>权限等级<span class="req">*</span></label>
                        <input class="input" type="number" min="1" max="9" v-model="form.permissionLevel" placeholder="1-9">
                    </div>
                    <div class="field">
                        <label>入职时间<span class="req">*</span></label>
                        <input class="input" type="date" v-model="form.entryTime">
                    </div>
                </template>

                <template v-if="form.role === '操作员'">
                    <div class="field">
                        <label>负责区域<span class="req">*</span></label>
                        <input class="input" v-model.trim="form.area" maxlength="30" placeholder="如：一楼借阅区">
                    </div>
                    <div class="field">
                        <label>职务<span class="req">*</span></label>
                        <input class="input" v-model.trim="form.duty" maxlength="30" placeholder="如：图书管理员">
                    </div>
                </template>
            </div>

            <div class="form-actions">
                <a class="btn btn-outline" href="login.html">返回登录</a>
                <button type="submit" class="btn btn-primary" :disabled="loading">{{ loading ? '提交中…' : '注 册' }}</button>
            </div>
        </form>

        <div class="auth-footer">已有账号？<a href="login.html">直接登录</a></div>
    </div>
</div>

<script src="vendor/vue.global.prod.js"></script>
<script src="vendor/axios.min.js"></script>
<script src="vendor/jquery.min.js"></script>
<script src="js/app.js"></script>
<script>
    Vue.createApp({
        data() {
            return {
                majors: ['计算机科学与技术', '软件工程', '信息管理与信息系统', '电子信息工程', '汉语言文学', '历史学', '经济学', '工商管理', '法学', '英语'],
                roles: ['学生', '教师', '管理员', '操作员'],
                grades: ['大一', '大二', '大三', '大四', '研一', '研二', '研三'],
                titles: ['教授', '副教授', '讲师', '助教'],
                form: {
                    name: '', phone: '', password: '', confirm: '', major: '', role: '学生',
                    grade: '', college: '', title: '', permissionLevel: '', entryTime: '', area: '', duty: ''
                },
                error: '',
                success: '',
                loading: false
            };
        },
        methods: {
            async submit() {
                this.error = '';
                this.success = '';
                const f = this.form;
                if (!f.name || f.name.length < 2) { this.error = '请输入 2-20 个字符的姓名'; return; }
                if (!/^1[3-9]\d{9}$/.test(f.phone)) { this.error = '请输入正确的 11 位手机号'; return; }
                if (!f.password || f.password.length < 6) { this.error = '密码不能少于 6 位'; return; }
                if (f.password !== f.confirm) { this.error = '两次输入的密码不一致'; return; }
                if (!f.major) { this.error = '请选择专业'; return; }
                if (f.role === '学生' && (!f.grade || !f.college)) { this.error = '请填写年级和所属学院'; return; }
                if (f.role === '教师' && (!f.college || !f.title)) { this.error = '请填写所属学院和职称'; return; }
                if (f.role === '管理员' && (!f.permissionLevel || !f.entryTime)) { this.error = '请填写权限等级和入职时间'; return; }
                if (f.role === '操作员' && (!f.area || !f.duty)) { this.error = '请填写负责区域和职务'; return; }

                this.loading = true;
                try {
                    await App.post('api/auth/register', f);
                    this.success = '注册成功，正在跳转到登录页…';
                    setTimeout(function () { location.href = 'login.html'; }, 1200);
                } catch (e) {
                    this.error = e.message;
                } finally {
                    this.loading = false;
                }
            }
        },
        async mounted() {
            try {
                const list = await App.get('api/auth/majors');
                if (Array.isArray(list) && list.length) this.majors = list;
            } catch (e) { /* 使用默认专业列表 */ }
        }
    }).mount('#app');
</script>
</body>
</html>
